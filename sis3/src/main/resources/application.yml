spring:
  application:
    name: bookstore-service
  profiles:
    active: @activatedProperties@
  datasource:
    url: jdbc:postgresql://localhost:5432/bookdb
    username: postgres
    password: Unurasyl06!!
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

bookstore:
  store-name: "KBTU Central Bookstore"
  max-books-per-author: 50

external:
  openlibrary:
    base-url: https://openlibrary.org
    connect-timeout: 2s
    read-timeout: 3s

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
